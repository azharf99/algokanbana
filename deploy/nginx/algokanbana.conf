# ==============================================================================
# AlgoKanbana Production Nginx Configuration (Tahap 1: Pra-SSL / Port 80)
# Gunakan konfigurasi ini terlebih dahulu agar "sudo nginx -t" lolos,
# kemudian jalankan: sudo certbot --nginx -d YOUR_DOMAIN.COM
# ==============================================================================

# Upstream ke container AlgoKanbana dengan persistent keepalive connection
upstream algokanbana_backend {
    server 127.0.0.1:8083;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.COM; # <-- Ganti dengan domain VPS Anda (contoh: tutor.azharfa.cloud)

    # Batas ukuran upload (untuk bukti foto/lampiran laporan tutor)
    client_max_body_size 25M;

    # Kompresi Gzip untuk mempercepat loading aset web frontend
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        text/xml
        application/xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Server-Sent Events (SSE) Stream Endpoint (/api/v1/events/stream)
    # Wajib proxy_buffering off agar event real-time live sync langsung sampai ke browser
    # --------------------------------------------------------------------------
    location /api/v1/events/stream {
        proxy_pass http://algokanbana_backend;
        proxy_http_version 1.1;

        # Nonaktifkan buffering & caching khusus koneksi SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_set_header Connection '';

        # Timeout panjang agar koneksi keep-alive tidak terputus tiap 60 detik
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Header Proxy Standar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 2. General Reverse Proxy (API Endpoints & Svelte SPA Frontend)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://algokanbana_backend;
        proxy_http_version 1.1;

        # Dukungan WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers (X-Forwarded-Proto penting agar Go mengaktifkan cookie Secure)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
