services:
  algokanbana:
    build:
      context: .
      dockerfile: Dockerfile
    image: azharfa/algokanbana:latest
    container_name: algokanbana
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1 so the container is only reachable by local Nginx reverse proxy
      - "127.0.0.1:8083:8080"
    env_file:
      - .env
    volumes:
      - algokanbana_data:/data

volumes:
  algokanbana_data:
